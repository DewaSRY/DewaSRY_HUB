# Local stack for Dewa Surya Hub: PostgreSQL + the Spring Boot API + Nginx (same rate limits and
# routing as production). The API is not published on the host; everything goes through Nginx.
#
#   docker compose up --build            # API at http://localhost:8088/v1 (through Nginx)
#
# Host ports avoid 5437 and 8081, which are used by unrelated containers on this machine.
# Override with HUB_DB_PORT / HUB_HTTP_PORT.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub}
      POSTGRES_DB: ${POSTGRES_DB:-hub}
    ports:
      - "${HUB_DB_PORT:-5434}:5432"
    volumes:
      - hub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hub} -d ${POSTGRES_DB:-hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-services:
    build:
      context: ./apps/coreservices
    image: dewa-hub/coreservices:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # `local` = no real credentials needed (fake Midtrans, local image storage, dev tokens).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hub}
      DB_USERNAME: ${POSTGRES_USER:-hub}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-hub}
      HUB_STORAGE_LOCAL_DIR: /app/media
      HUB_STORAGE_PUBLIC_BASE_URL: http://localhost:${HUB_HTTP_PORT:-8088}/local-media
      HUB_CORS_ALLOWED_ORIGINS: ${HUB_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      HUB_BOOTSTRAP_ADMIN_UID: ${HUB_BOOTSTRAP_ADMIN_UID:-local-admin}
      HUB_REVALIDATE_URL: ${HUB_REVALIDATE_URL:-}
      HUB_REVALIDATE_SECRET: ${HUB_REVALIDATE_SECRET:-}
      MIDTRANS_MODE: ${MIDTRANS_MODE:-fake}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-local-fake-server-key}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-dewa-surya-hub-local}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError -Djava.io.tmpdir=/app/tmp"
    volumes:
      - hub_media:/app/media
    mem_limit: 768m
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      core-services:
        condition: service_healthy
    ports:
      - "${HUB_HTTP_PORT:-8088}:80"
    volumes:
      - ./apps/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  hub_postgres_data:
  hub_media:
