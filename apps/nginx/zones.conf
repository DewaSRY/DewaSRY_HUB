# http-level config shared by local and production Nginx (ADR-001 §5.5, ADR-003 §3.7).
# Mounted as /etc/nginx/conf.d/00-zones.conf. The server block is server.local.conf (docker compose)
# or server.prod.conf (EC2, ADR-006 §6); both include /etc/nginx/hub/routes.conf.

# ---- Rate-limit zones (per client IP) -----------------------------------------------------------
limit_req_zone $binary_remote_addr zone=session:10m    rate=10r/m;   # /v1/me/session
limit_req_zone $binary_remote_addr zone=checkout:10m   rate=10r/m;   # /v1/checkout
limit_req_zone $binary_remote_addr zone=sso:10m        rate=10r/m;   # /v1/sso/codes, /v1/sso/token
limit_req_zone $binary_remote_addr zone=products:10m   rate=600r/m;  # /v1/products/*/members|entitlements (product servers)
limit_req_zone $binary_remote_addr zone=media:10m      rate=30r/m;   # /v1/admin/media (upload)
limit_req_zone $binary_remote_addr zone=linkpreview:10m rate=30r/m;  # /v1/admin/link-preview (ADR-009 §5.5)
limit_req_zone $binary_remote_addr zone=vote:10m       rate=30r/m;   # /v1/me/articles/*/vote (ADR-010 §7.5)
limit_req_zone $binary_remote_addr zone=comment:10m    rate=10r/m;   # /v1/me/articles/*/comment
limit_req_zone $binary_remote_addr zone=mention:10m    rate=60r/m;   # /v1/me/mentionable-users
limit_req_zone $binary_remote_addr zone=general:10m    rate=120r/m;  # everything else
limit_req_status 429;
limit_req_log_level warn;

# /etc/nginx/hub/upstream.conf is one line naming the API container: `server core-services:8080;`
# locally, `server api-blue:8080;` or `server api-green:8080;` in production, where deploy.sh
# rewrites it and reloads Nginx to switch colors (ADR-007 §8.3).
upstream core_services {
    include /etc/nginx/hub/upstream.conf;
    keepalive 16;
}

# X-Trace-Id: pass the client's through, or use nginx's request id.
map $http_x_trace_id $trace_id {
    ""      $request_id;
    default $http_x_trace_id;
}
