# Reverse proxy + per-IP rate limits in front of core-services (ADR-001 §5.5, ADR-003 §3.7), for
# local `docker compose up`. Mirrors infra/terraform/nginx.conf.tpl (the EC2 setup) as a plain
# static file — keep the two in sync by hand. TLS is terminated here in production (certbot).
#
# core-services is not published on the host (see docker-compose.yaml); this is the only way in.

# ---- Rate-limit zones (per client IP) -----------------------------------------------------------
limit_req_zone $binary_remote_addr zone=session:10m    rate=10r/m;   # /v1/me/session
limit_req_zone $binary_remote_addr zone=checkout:10m   rate=10r/m;   # /v1/checkout
limit_req_zone $binary_remote_addr zone=sso:10m        rate=10r/m;   # /v1/sso/codes, /v1/sso/token
limit_req_zone $binary_remote_addr zone=products:10m   rate=600r/m;  # /v1/products/*/members|entitlements (product servers)
limit_req_zone $binary_remote_addr zone=media:10m      rate=30r/m;   # /v1/admin/media (upload)
limit_req_zone $binary_remote_addr zone=linkpreview:10m rate=30r/m;  # /v1/admin/link-preview (ADR-009 §5.5)
limit_req_zone $binary_remote_addr zone=general:10m    rate=120r/m;  # everything else
limit_req_status 429;
limit_req_log_level warn;

upstream core_services {
    server core-services:8080;
    keepalive 16;
}

# X-Trace-Id: pass the client's through, or use nginx's request id.
map $http_x_trace_id $trace_id {
    ""      $request_id;
    default $http_x_trace_id;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Trace-Id $trace_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # Errors produced by nginx itself use the API error envelope (ADR-003 §3.5).
    error_page 413 = @payload_too_large;
    error_page 429 = @rate_limited;
    error_page 502 503 = @upstream_error;
    error_page 504 = @gateway_timeout;

    # Actuator is internal only (health checks hit the container directly).
    location /actuator {
        return 404;
    }
    location /v1/actuator {
        return 404;
    }

    location = /v1/me/session {
        limit_req zone=session burst=5 nodelay;
        proxy_pass http://core_services;
    }

    location = /v1/checkout {
        limit_req zone=checkout burst=5 nodelay;
        proxy_pass http://core_services;
    }

    location ~ ^/v1/sso/(codes|token)$ {
        limit_req zone=sso burst=5 nodelay;
        proxy_pass http://core_services;
    }

    location ~ ^/v1/products/[^/]+/(members|entitlements/) {
        limit_req zone=products burst=100 nodelay;
        proxy_pass http://core_services;
    }

    # Uploads: 10 MB images + multipart overhead; the API checks again.
    location ~ ^/v1/admin/media/?$ {
        client_max_body_size 11m;
        limit_req zone=media burst=10 nodelay;
        proxy_request_buffering on;
        proxy_read_timeout 120s;
        proxy_pass http://core_services;
    }

    location = /v1/admin/link-preview {
        limit_req zone=linkpreview burst=5 nodelay;
        proxy_pass http://core_services;
    }

    # Midtrans notifications: not rate limited (restrict to Midtrans IP ranges here if published).
    location = /v1/webhooks/midtrans {
        proxy_pass http://core_services;
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://core_services;
    }

    location @payload_too_large {
        default_type application/json;
        add_header X-Trace-Id $trace_id always;
        add_header Cache-Control no-store always;
        return 413 '{"code":413,"message":"The upload is too large","error":[]}';
    }

    location @rate_limited {
        default_type application/json;
        add_header X-Trace-Id $trace_id always;
        add_header Retry-After 60 always;
        add_header Cache-Control no-store always;
        return 429 '{"code":429,"message":"Too many requests","error":[]}';
    }

    location @upstream_error {
        default_type application/json;
        add_header X-Trace-Id $trace_id always;
        add_header Cache-Control no-store always;
        return 502 '{"code":502,"message":"An upstream service failed","error":[]}';
    }

    location @gateway_timeout {
        default_type application/json;
        add_header X-Trace-Id $trace_id always;
        add_header Cache-Control no-store always;
        return 504 '{"code":504,"message":"The API did not answer in time","error":[]}';
    }
}
