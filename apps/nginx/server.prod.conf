# Production server block on EC2 (ADR-006 §6). Cloudflare proxies api.dewasuryahub.com and connects
# with TLS (Full strict) using the Cloudflare Origin CA certificate that deploy.sh renders from SSM.
# The client IP comes from CF-Connecting-IP; the set_real_ip_from lines are 01-cloudflare-realip.conf,
# rendered by Terraform from var.cloudflare_ipv4_cidrs (the same list the security group uses).

# Refuse any other host name, so other Cloudflare zones cannot use this origin (ADR-006 T3).
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.dewasuryahub.com;

    ssl_certificate     /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/hub/routes.conf;
}
