plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sdewa'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	shedlockVersion = '7.10.1'
	scrimageVersion = '4.6.8'
	awsSdkVersion = '2.55.6'
	firebaseAdminVersion = '9.11.0'
	bouncycastleVersion = '1.86'
	jsoupVersion = '1.23.2'
}

dependencyManagement {
	imports {
		mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
	}
}

dependencies {
	// Web, validation, persistence
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'

	// Security: Firebase ID tokens validated as JWTs (resource server)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	// Argon2PasswordEncoder needs BouncyCastle
	implementation "org.bouncycastle:bcprov-jdk18on:${bouncycastleVersion}"

	// Firebase Admin SDK: only used to mint custom tokens for hub SSO
	implementation("com.google.firebase:firebase-admin:${firebaseAdminVersion}")

	// Scheduler lock (ShedLock, PostgreSQL)
	implementation "net.javacrumbs.shedlock:shedlock-spring:${shedlockVersion}"
	implementation "net.javacrumbs.shedlock:shedlock-provider-jdbc-template:${shedlockVersion}"

	// Images: resize + WebP encode
	implementation "com.sksamuel.scrimage:scrimage-core:${scrimageVersion}"
	implementation "com.sksamuel.scrimage:scrimage-webp:${scrimageVersion}"

	// S3
	implementation 'software.amazon.awssdk:s3'

	// Link preview: SSRF-safe fetch (custom DNS resolver) + HTML parsing
	implementation 'org.apache.httpcomponents.client5:httpclient5'
	implementation "org.jsoup:jsoup:${jsoupVersion}"

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	maxHeapSize = '1g'
	testLogging {
		events 'failed'
		exceptionFormat 'full'
	}
}
